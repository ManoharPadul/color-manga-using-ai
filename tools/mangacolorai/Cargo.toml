[package]
name = "mangacolorai"
version = "0.3.15"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
