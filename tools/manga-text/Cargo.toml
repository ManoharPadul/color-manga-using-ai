[package]
name = "mangacolorai-text"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Optional text-processing helper, linked against the pinned Koharu libraries.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25.10"
imageproc = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
koharu-ml = { path = "../../.local-ai/research-repos/koharu-rs__koharu/crates/koharu-ml" }
koharu-runtime = { path = "../../.local-ai/research-repos/koharu-rs__koharu/crates/koharu-runtime" }
koharu-config = { path = "../../.local-ai/research-repos/koharu-rs__koharu/crates/koharu-config" }
koharu-translator = { path = "../../.local-ai/research-repos/koharu-rs__koharu/crates/koharu-translator" }
